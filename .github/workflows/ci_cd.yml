name: CI/CD Pipeline

on:
    push:
        branches: ["main", "development"]
    pull_request:
        branches: ["main", "development"]

jobs:
    tests:
        name: Run Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Python 3.11
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
                  cache: "pip"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Run Pytest
              env:
                  SECRET_KEY: "test_secret_key"
                  ALGORITHM: "HS256"
                  ACCESS_TOKEN_EXPIRE_MINUTES: 30
                  REFRESH_TOKEN_EXPIRE_MINUTES: 60
                  EMAIL_VERIFICATION_CODE_EXPIRE_MINUTES: 10
                  RESET_TOKEN_EXPIRE_MINUTES: 30
                  NUMBER_OF_BYTES_FOR_RESET_TOKEN_GENERATION: 32
                  RESEND_API_KEY: "re_test_key"
                  EMAIL_SENDER: "test@example.com"
                  S3_ACCESS_KEY: "test"
                  S3_SECRET_KEY: "test"
                  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
              run: |
                  pytest -v

    build-and-push:
        name: Build Docker Image
        needs: tests
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ secrets.DOCKERHUB_USERNAME }}/documents-exp-api:latest

    deploy:
        name: Deploy to Server
        needs: build-and-push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        runs-on: ubuntu-latest

        steps:
            - name: Execute remote commands via SSH
              uses: appleboy/ssh-action@v1.0.3
              env:
                  DOCKER_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  envs: DOCKER_USERNAME
                  script: |
                      cd /opt/documents-exp
                      docker compose stop api
                      docker compose rm -f api
                      docker rmi $DOCKER_USERNAME/documents-exp-api:latest || true
                      docker pull $DOCKER_USERNAME/documents-exp-api:latest
                      docker compose up -d api
                      docker image prune -f
