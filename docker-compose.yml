services:
    api:
        build: .
        container_name: documents_api
        ports:
            - "8000:8000"
        env_file:
            - .env
        environment:
            - SERVER_HOST=0.0.0.0
            - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASS}@db:5432/${DB_NAME}
            - REDIS_URL=redis://redis:6379
            - S3_ENDPOINT_URL=http://minio:9000
        depends_on:
            - db
            - redis
        restart: always

    db:
        image: postgres:15-alpine
        container_name: documents_db
        environment:
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASS}
            POSTGRES_DB: ${DB_NAME}
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        restart: always

    redis:
        image: redis:7-alpine
        container_name: documents_redis
        ports:
            - "6379:6379"
        restart: always

    minio:
        image: minio/minio:RELEASE.2024-01-18T22-51-28Z
        container_name: documents_minio
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        restart: always

volumes:
    postgres_data:
    minio_data:
